name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck, test, and build
        run: bun run check

      - name: Compile Linux standalone binary
        run: bun run compile:linux

  package:
    name: Package distributions
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$package_version" ]]; then
              echo "Tag v$version does not match package.json version $package_version" >&2
              exit 1
            fi
          else
            version="${package_version}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        env:
          NFPM_VERSION: 2.47.0
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y podman rpm zstd
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          base_url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          mkdir -p "$RUNNER_TEMP/nfpm"
          cd "$RUNNER_TEMP/nfpm"
          curl -fsSLO "$base_url/$archive"
          curl -fsSLO "$base_url/checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      - name: Build application
        run: bun run build:binary

      - name: Build Linux packages
        env:
          AGENTDOCK_MAINTAINER: ybh618618 <301931498+ybh618618@users.noreply.github.com>
          AGENTDOCK_HOMEPAGE: https://github.com/ybh618618/agentdock
          AGENTDOCK_LICENSE: Proprietary
        run: |
          packaging/linux/build.sh \
            "${{ steps.version.outputs.version }}" \
            amd64 \
            dist/linux-amd64/agentdock \
            dist/release

      - name: Build Windows WSL package
        run: |
          packaging/windows/build-wsl.sh \
            "${{ steps.version.outputs.version }}" \
            amd64 \
            dist/release

      - name: Verify packages and checksums
        shell: bash
        run: |
          dpkg-deb --info dist/release/*.deb >/dev/null
          rpm --query --package dist/release/*.rpm >/dev/null
          tar --list --file dist/release/*.pkg.tar.zst >/dev/null
          rm -f dist/release/SHA256SUMS
          cd dist/release
          sha256sum *.deb *.rpm *.pkg.tar.zst *.wsl > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentdock-${{ steps.version.outputs.version }}-amd64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: agentdock-${{ needs.package.outputs.version }}-amd64
          path: dist/release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "AgentDock ${{ needs.package.outputs.version }}"
          fi
